[project]
name = "industrial-vision-sorting"
version = "0.1.0"
description = "工业六轴机器人视觉引导动态分拣系统 —— 视觉引导软件部分（含硬件模拟件，可离线端到端运行）"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8,<5",
    "pymodbus>=3.7,<3.9",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.1"]
patchcore = ["torch>=2.1", "torchvision>=0.16"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
sorting-demo = "sorting_vision.cli:demo"
sorting-benchmark = "sorting_vision.cli:benchmark"
sorting-calibrate = "sorting_vision.cli:calibrate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sorting_vision"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
